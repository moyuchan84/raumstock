<style>
/* Layout: phone-width app shell (MTS style). Sticky top status bar, scrolling view, coach card + time bar above a fixed bottom tab bar. Desktop centers the shell. */
:root {
  --bg: #070b16; --app: #0b1020; --surface: #121a2e; --surface-2: #19233b; --line: #243150;
  --text: #e9eefb; --muted: #8c99b8; --up: #ff5a5f; --down: #4c8dff; --accent: #ffc83d; --mint: #2fd3a5;
  --r: 14px; --tab-h: 64px;
  --f: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.3; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
b, .tnum, dd, output, input { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); } .mint { color: var(--mint); }
.muted { color: var(--muted); } .small { font-size: .82rem; }
.eyebrow { font-size: .72rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; }

.app { max-width: 460px; margin: 0 auto; min-height: 100dvh; background: var(--app); position: relative; padding-bottom: calc(var(--tab-h) + 150px + env(safe-area-inset-bottom)); }
@media (min-width: 520px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* 3D city + covers */
.city { position: relative; height: 230px; margin: 16px 16px 0; border-radius: 20px; overflow: hidden; background: radial-gradient(90% 120% at 50% 0%, #1d2b52, #0b1020 70%); border: 1px solid var(--line); }
.city[hidden] { display: none; }
.city-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.city::after { content: "빌딩 높이 = 그날의 시가총액"; position: absolute; right: 12px; bottom: 10px; font-size: .7rem; color: var(--muted); background: rgb(11 16 32 / .7); padding: 3px 8px; border-radius: 99px; }
.cover { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; display: block; background: var(--surface); }
.chapters .chap { grid-template-columns: 72px minmax(0, 1fr) auto; }
.thumb { width: 72px; height: 48px; border-radius: 10px; object-fit: cover; display: block; position: relative; }
.chap .tw { position: relative; }
.chap .tw .no { position: absolute; left: -6px; top: -6px; width: 24px; height: 24px; border-radius: 8px; font-size: .75rem; box-shadow: 0 2px 6px rgb(0 0 0 / .4); }
.chap.lock .thumb { filter: grayscale(.8) brightness(.6); }
.chapters .chap.now { grid-template-columns: 1fr; }
.chap.now .tw .thumb { width: 100%; height: auto; aspect-ratio: 16 / 9; }
.chap.now .tag { justify-self: start; }

/* top status */
#top[hidden] { display: none; }
#top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--app) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.t-date { display: grid; line-height: 1.25; } .t-date b { font-size: .95rem; } .t-date span { font-size: .72rem; color: var(--muted); }
.t-total { margin-left: auto; display: grid; text-align: right; line-height: 1.25; } .t-total b { font-size: .95rem; } .t-total span { font-size: .75rem; font-weight: 600; }
.vix { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.vix.warn { color: var(--accent); } .vix.fear { background: var(--up); color: #fff; }

#view { padding: 16px; display: grid; gap: 14px; }
.sec { font-size: 1.15rem; display: flex; align-items: baseline; gap: 8px; } .sec small { font-size: .8rem; color: var(--muted); font-weight: 500; }
.sub { font-size: .95rem; margin-top: 6px; display: flex; gap: 8px; align-items: baseline; } .sub small { color: var(--muted); font-weight: 500; font-size: .78rem; }
.empty { color: var(--muted); font-size: .9rem; padding: 10px 0; }
.foot { font-size: .75rem; color: var(--muted); line-height: 1.6; }
.linkbtn { text-decoration: underline; color: var(--muted); font-size: .75rem; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; font-weight: 700; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: #141a2b; }
.btn.ghost { background: var(--surface-2); padding: 8px 12px; font-size: .88rem; }
.btn.buy, .btn.buy-cta { background: var(--up); color: #fff; } .btn.sell, .btn.sell-cta { background: var(--down); color: #fff; }
.btn.wide { width: 100%; } .btn.xs { padding: 4px 10px; font-size: .78rem; margin-left: auto; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* home */
.hero { background: radial-gradient(120% 120% at 100% 0%, #24345e 0%, var(--surface) 55%); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; display: grid; gap: 10px; }
.hero h1 { font-size: 1.55rem; font-weight: 800; }
.hero-bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; } .hero-bar i { display: block; height: 100%; background: var(--mint); }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.chap { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.chap .no { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font-weight: 800; }
.chap div { display: grid; } .chap small { font-size: .78rem; color: var(--muted); }
.chap .tag { font-size: .72rem; font-weight: 700; color: var(--muted); }
.chap.now { border-color: var(--accent); } .chap.now .no { background: var(--accent); color: #141a2b; } .chap.now .tag { color: var(--accent); }
.chap.done .no { background: color-mix(in srgb, var(--mint) 20%, transparent); color: var(--mint); } .chap.done .tag { color: var(--mint); }
.chap.lock { opacity: .55; }
.chap.free { background: linear-gradient(135deg, #1b2a4d, var(--surface)); }
.chap .link { color: var(--accent); text-decoration: none; font-size: .85rem; }

/* watch list */
.watch, .holds, .orders { list-style: none; margin: 0; padding: 0; display: grid; }
.wrow, .hrow { width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) 60px auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.hrow { grid-template-columns: minmax(0, 1fr) auto; }
.logo { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--surface-2); color: var(--muted); }
.l-AAPL { background: #e9eefb; color: #111; } .l-AMZN { background: #ff9900; color: #111; } .l-ZM { background: #2d8cff; color: #fff; } .l-NFLX { background: #e50914; color: #fff; }
.l-AAL { background: #36495a; color: #fff; } .l-CCL { background: #1d3f8f; color: #fff; } .l-XOM { background: #d6212e; color: #fff; } .l-SPY { background: #2fd3a5; color: #111; }
.wn { display: grid; min-width: 0; } .wn small { color: var(--muted); font-size: .78rem; } .wn em { font-style: normal; color: var(--accent); }
.wp { display: grid; text-align: right; } .wp small { font-size: .8rem; font-weight: 600; }
.spark { width: 60px; height: 22px; } .spark polyline { fill: none; stroke-width: 1.6; } .spark.up polyline { stroke: var(--up); } .spark.down polyline, .spark.flat polyline { stroke: var(--down); }

/* stock */
.s-head { display: flex; gap: 10px; align-items: center; }
.back { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); font-size: 1.4rem; line-height: 1; }
.s-head h2 { font-size: 1.3rem; }
.s-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; } .s-price b { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; } .s-price span { font-weight: 600; }
.own-strip { display: flex; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .85rem; }
.seg { display: flex; gap: 4px; background: var(--surface); border-radius: 12px; padding: 4px; }
.seg button { flex: 1; white-space: nowrap; padding: 8px; border-radius: 9px; font-weight: 600; color: var(--muted); font-size: .9rem; }
.seg button.on { background: var(--surface-2); color: var(--text); }
.seg.sm button { padding: 5px 8px; font-size: .8rem; }
.seg.side button.on.buy { background: var(--up); color: #fff; } .seg.side button.on.sell { background: var(--down); color: #fff; }
.s-body { display: grid; gap: 12px; }
.chart-tools { display: flex; gap: 8px; justify-content: space-between; } .chart-tools .seg { flex: 0 1 auto; }
.chart-box { background: var(--surface); border-radius: var(--r); padding: 8px 4px; }
.chart { display: block; width: 100%; height: auto; }
.chart .g { stroke: var(--line); } .chart .tk { fill: var(--muted); font-size: 10px; font-family: var(--f); }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; } .chart .area { opacity: .12; }
.chart.up .ln { stroke: var(--up); } .chart.up .area, .chart.up .dot { fill: var(--up); }
.chart.down .ln { stroke: var(--down); } .chart.down .area, .chart.down .dot { fill: var(--down); }
.chart .cu { stroke: var(--up); fill: var(--up); } .chart .cd { stroke: var(--down); fill: var(--down); }
.kv { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { background: var(--surface); border-radius: 12px; padding: 10px; display: grid; gap: 2px; }
.kv dt { font-size: .72rem; color: var(--muted); } .kv dd { margin: 0; font-weight: 700; }
.kv.list { grid-template-columns: 1fr; gap: 0; background: var(--surface); border-radius: var(--r); padding: 4px 12px; }
.kv.list div { display: flex; justify-content: space-between; gap: 12px; background: none; border-radius: 0; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv.list div:last-child { border-bottom: 0; } .kv.list dd { text-align: right; }
.nlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .88rem; } .nlist small { color: var(--muted); margin-right: 6px; }
.desc { color: var(--muted); }
.book { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: .88rem; }
.book li { display: grid; grid-template-columns: 1fr 96px 1fr; align-items: center; gap: 8px; padding: 4px 0; }
.book li b { text-align: center; } .book .ask b { color: var(--down); } .book .bid b { color: var(--up); }
.bq { position: relative; text-align: right; color: var(--muted); font-size: .78rem; padding: 2px 6px; } .bid .bq { text-align: left; }
.bq i { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 4px; z-index: -1; } .ask .bq i { background: color-mix(in srgb, var(--down) 22%, transparent); }
.bid .bq i { left: 0; right: auto; background: color-mix(in srgb, var(--up) 22%, transparent); }
.book .bq { isolation: isolate; }
.book .mid { background: var(--surface); border-radius: 8px; padding: 8px 6px; font-weight: 700; } .book .mid span:first-child { color: var(--muted); font-size: .78rem; }
.fbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.fbars li { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; font-size: .88rem; }
.fbars small { grid-column: 3; text-align: right; color: var(--muted); font-size: .75rem; }
.fb { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; } .fb i { display: block; height: 100%; background: var(--mint); }
.note { background: var(--surface); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: .9rem; }
.cta { position: sticky; bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 8px; z-index: 5; }

/* account */
.acct { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 4px; }
.acct .big { font-size: 1.7rem; font-weight: 800; } .acct > span { font-weight: 700; font-size: .9rem; }
.acct .kv.list { background: none; padding: 4px 0 0; }
.orders li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.orders li > span:first-child { font-weight: 700; font-size: .78rem; }
.orders small { color: var(--muted); }
.gloss { margin: 0; display: grid; gap: 8px; }
.gloss div { background: var(--surface); border-radius: 12px; padding: 12px 14px; } .gloss dt { font-weight: 700; } .gloss dd { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

/* coach + time bar */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); width: min(460px, 100%); z-index: 30; display: grid; gap: 8px; padding: 0 12px 10px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.coach { background: #1a2542; border: 1px solid #2f3f69; border-radius: 18px; padding: 14px 16px; box-shadow: 0 -8px 30px rgb(0 0 0 / .45); display: grid; gap: 10px; max-height: 62dvh; overflow: auto; }
.coach.hide { display: none; }
.coach.mini { padding: 12px 14px; gap: 6px; }
.c-head { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); font-weight: 600; } .c-head small { margin-left: auto; }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #141a2b; font-weight: 800; font-size: .8rem; }
.c-body { display: grid; gap: 10px; } .c-body h3 { font-size: 1.1rem; }
.c-act { display: flex; justify-content: flex-end; }
.coach.full { animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } }
.seeds { display: grid; gap: 8px; }
.seed { display: grid; gap: 2px; text-align: left; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; } .seed small { color: var(--muted); font-size: .8rem; }
.seed:hover { border-color: var(--accent); }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; padding: 11px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.opt.right { border-color: var(--mint); color: var(--mint); } .opt.wrong { border-color: var(--up); color: var(--up); }
.why { font-size: .9rem; } .why.ok { color: var(--mint); } .why.no { color: var(--muted); }
.newscard { background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.ntag { font-size: .7rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.newscard p { color: var(--muted); font-size: .9rem; }
#timebar { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; font-size: .85rem; }
#timebar span { margin-right: auto; color: var(--muted); }
#timebar[hidden] { display: none; }

/* tab bar */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(460px, 100%); height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(5, 1fr); background: #0d1325; border-top: 1px solid var(--line); z-index: 40; }
.tabbar button { display: grid; place-items: center; align-content: center; gap: 2px; font-size: .72rem; color: var(--muted); font-weight: 600; }
.tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.on { color: var(--text); }

/* sheet, toast */
#scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .5); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
#scrim.on { opacity: 1; pointer-events: auto; }
#sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 105%); width: min(460px, 100%); max-height: 88dvh; overflow: auto; background: var(--app); border: 1px solid var(--line); border-radius: 22px 22px 0 0; z-index: 60; transition: transform .25s ease-out; padding-bottom: env(safe-area-inset-bottom); }
#sheet.open { transform: translate(-50%, 0); }
.sh-in { padding: 18px 16px 20px; display: grid; gap: 12px; }
.sh-head { display: flex; align-items: center; justify-content: space-between; } .sh-head small { color: var(--muted); font-weight: 500; }
.x { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); }
.fld { display: grid; gap: 6px; } .fld > span { font-size: .8rem; color: var(--muted); font-weight: 600; }
.fld output { font-weight: 700; font-size: 1.1rem; }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; background: var(--surface); border-radius: 12px; overflow: hidden; }
.stepper button { font-size: 1.3rem; } .stepper input { background: none; border: 0; color: var(--text); text-align: center; font: inherit; font-size: 1.15rem; font-weight: 700; padding: 10px 0; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; } .chip { padding: 5px 10px; border-radius: 99px; background: var(--surface); font-size: .8rem; color: var(--muted); }
.omsg { color: var(--up); font-size: .85rem; min-height: 1em; }
.evt { background: color-mix(in srgb, var(--mint) 12%, var(--surface)); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
#toast { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -20px); width: min(420px, calc(100% - 24px)); background: #24345e; border-radius: 12px; padding: 12px 14px; font-size: .9rem; opacity: 0; pointer-events: none; transition: .25s; z-index: 70; box-shadow: 0 10px 30px rgb(0 0 0 / .4); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* 🧒 쉽게 보기 */
.kid { display: block; color: #ffd98a; font-size: .74rem; font-weight: 500; margin-top: 2px; line-height: 1.4; }
dd.kid { color: #ffd98a; font-size: .85rem; }
.kidbox { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
.kidbox b { color: var(--accent); font-size: .8rem; } .kidbox p { font-size: .95rem; line-height: 1.6; }
.kidline { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-radius: 10px; padding: 8px 10px; font-size: .85rem; color: #ffe3a3; line-height: 1.55; }
.kidtoggle { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.kidtoggle.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.c-head .kidtoggle { margin-left: auto; } .c-head .kidtoggle + small { margin-left: 8px; }
.kv.list dt { display: grid; }
.fbars small.kid { grid-column: 1 / -1; text-align: left; font-size: .74rem; color: #ffd98a; margin-top: -4px; }

/* 실전 훈련 */
.thero h1 { font-size: 1.5rem; }
.tlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tlist button { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; text-align: left; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tlist small { grid-column: 2; color: var(--muted); font-size: .75rem; }
.tq { font-size: .68rem; font-weight: 800; padding: 3px 7px; border-radius: 6px; background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); grid-row: span 2; }
.tq.ch { background: color-mix(in srgb, var(--mint) 18%, transparent); color: var(--mint); }
.t-news, .t-per { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.t-cut { background: color-mix(in srgb, var(--down) 20%, transparent); color: var(--down); }
.t-goal, .t-long { background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); }
.t-pull, .t-split { background: color-mix(in srgb, var(--mint) 18%, transparent); color: var(--mint); }
.tdone { color: var(--mint); font-weight: 800; grid-row: span 2; }
